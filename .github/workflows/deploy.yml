name: Deploy to Digital Ocean

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Deploy target. Was secrets.DO_HOST, which still pointed at the
    # decommissioned droplet 159.223.83.208; that IP was recycled by
    # DigitalOcean to another tenant. Set here because updating the
    # secret requires repo admin.
    env:
      DO_HOST: 68.183.178.88
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (standalone)
        run: bun run build
        env:
          BUILD_STANDALONE: "true"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID }}
          NEXT_PUBLIC_SITE_APEX: ${{ secrets.NEXT_PUBLIC_SITE_APEX }}
          SITE_APEX_HOSTS: ${{ secrets.SITE_APEX_HOSTS }}
          SITE_PUBLIC_APEX: ${{ secrets.SITE_PUBLIC_APEX }}

      - name: Assemble standalone bundle
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      - name: Copy build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          source: ".next/standalone/"
          target: /var/www/ai-audit/
          strip_components: 2
          overwrite: true

      - name: Restart app
        uses: appleboy/ssh-action@v1.0.3
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID }}
          NEXT_PUBLIC_SITE_APEX: ${{ secrets.NEXT_PUBLIC_SITE_APEX }}
          SITE_APEX_HOSTS: ${{ secrets.SITE_APEX_HOSTS }}
          SITE_PUBLIC_APEX: ${{ secrets.SITE_PUBLIC_APEX }}
        with:
          host: ${{ env.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: ANTHROPIC_API_KEY,BLOB_READ_WRITE_TOKEN,DATABASE_URL,BETTER_AUTH_SECRET,BETTER_AUTH_URL,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,NEXT_PUBLIC_GOOGLE_MAPS_API_KEY,NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID,NEXT_PUBLIC_APP_URL,SITE_APEX_HOSTS,SITE_PUBLIC_APEX,NEXT_PUBLIC_SITE_APEX
          script: |
            export PATH="$HOME/.bun/bin:$PATH"
            command -v bun >/dev/null 2>&1 || npm install -g bun
            BUN_BIN="$(command -v bun)"
            echo "Using bun: $BUN_BIN ($($BUN_BIN --version))"
            cd /var/www/ai-audit
            cat > .env << ENVEOF
            ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY
            BLOB_READ_WRITE_TOKEN=$BLOB_READ_WRITE_TOKEN
            DATABASE_URL=$DATABASE_URL
            BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET
            BETTER_AUTH_URL=$BETTER_AUTH_URL
            GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=$NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
            NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID=$NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID
            NEXT_PUBLIC_APP_URL=$NEXT_PUBLIC_APP_URL
            SITE_APEX_HOSTS=$SITE_APEX_HOSTS
            SITE_PUBLIC_APEX=$SITE_PUBLIC_APEX
            NEXT_PUBLIC_SITE_APEX=$NEXT_PUBLIC_SITE_APEX
            ENVEOF
            # Recreate under bun so the interpreter is guaranteed (pm2 restart
            # keeps whatever interpreter the process was first started with).
            pm2 delete ai-audit 2>/dev/null || true
            PORT=3000 HOSTNAME=127.0.0.1 pm2 start server.js \
              --name ai-audit --interpreter "$BUN_BIN" --update-env
            pm2 save
            # Fail the deploy if it didn't come up under bun.
            pm2 describe ai-audit | grep -q "$BUN_BIN" \
              || { echo "ai-audit is NOT running under bun"; pm2 describe ai-audit; exit 1; }
