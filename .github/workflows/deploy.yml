name: Deploy to Digital Ocean

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID }}
          NEXT_PUBLIC_SITE_APEX: ${{ secrets.NEXT_PUBLIC_SITE_APEX }}
          SITE_APEX_HOSTS: ${{ secrets.SITE_APEX_HOSTS }}
          SITE_PUBLIC_APEX: ${{ secrets.SITE_PUBLIC_APEX }}

      - name: Copy build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          source: ".next/,public/,package.json,package-lock.json,next.config.ts"
          target: /var/www/ai-audit/
          overwrite: true

      - name: Install deps & restart app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: ANTHROPIC_API_KEY,BLOB_READ_WRITE_TOKEN,NEXT_PUBLIC_GOOGLE_MAPS_API_KEY,NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID,NEXT_PUBLIC_APP_URL,SITE_APEX_HOSTS,SITE_PUBLIC_APEX,NEXT_PUBLIC_SITE_APEX
          script: |
            cd /var/www/ai-audit
            npm ci --omit=dev
            cat > .env.local << ENVEOF
            ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY
            BLOB_READ_WRITE_TOKEN=$BLOB_READ_WRITE_TOKEN
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=$NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
            NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID=$NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID
            NEXT_PUBLIC_APP_URL=$NEXT_PUBLIC_APP_URL
            SITE_APEX_HOSTS=$SITE_APEX_HOSTS
            SITE_PUBLIC_APEX=$SITE_PUBLIC_APEX
            NEXT_PUBLIC_SITE_APEX=$NEXT_PUBLIC_SITE_APEX
            ENVEOF
            pm2 restart ai-audit || pm2 start npm --name ai-audit -- start
            pm2 save
