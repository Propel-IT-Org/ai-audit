<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <!-- AIVIBLE · "Audit score" — Shirube + progress-arc badge + ryokan -->
  <rect width="320" height="320" fill="#F9ECD9"/>

  <!-- ryokan (right) -->
  <g>
    <!-- lower roof eave -->
    <path d="M226 190 L242 172 L300 172 L316 190 Z" fill="#16335e"/>
    <!-- ground floor -->
    <rect x="238" y="188" width="70" height="62" fill="#204E8E"/>
    <rect x="238" y="188" width="13" height="62" fill="#2E5286"/>
    <!-- upper floor + windows -->
    <rect x="250" y="146" width="46" height="28" fill="#2E5286"/>
    <g fill="#F4ECDD"><rect x="254" y="150" width="2.6" height="20"/><rect x="259" y="150" width="2.6" height="20"/><rect x="264" y="150" width="2.6" height="20"/><rect x="269" y="150" width="2.6" height="20"/><rect x="274" y="150" width="2.6" height="20"/><rect x="279" y="150" width="2.6" height="20"/><rect x="284" y="150" width="2.6" height="20"/><rect x="289" y="150" width="2.6" height="20"/></g>
    <!-- upper roof + gable -->
    <path d="M244 146 L258 130 L288 130 L302 146 Z" fill="#16335e"/>
    <path d="M258 130 L273 121 L288 130 Z" fill="#0F2747"/>
    <!-- noren + onsen steam -->
    <rect x="248" y="202" width="50" height="15" fill="#16335e"/>
    <g fill="none" stroke="#F4ECDD" stroke-width="1.6" stroke-linecap="round"><path d="M258 208 q-2 -3 0 -6"/><path d="M263 208 q-2 -3 0 -6"/><path d="M268 208 q-2 -3 0 -6"/></g>
    <!-- entrance -->
    <rect x="258" y="217" width="20" height="33" fill="#0F2747"/>
    <!-- 旅館 sign -->
    <rect x="298" y="198" width="15" height="30" rx="2" fill="#F4ECDD"/>
    <text x="305.5" y="210" font-family="serif" font-size="9" font-weight="700" fill="#16335e" text-anchor="middle">旅</text>
    <text x="305.5" y="222" font-family="serif" font-size="9" font-weight="700" fill="#16335e" text-anchor="middle">館</text>
    <!-- bush -->
    <circle cx="306" cy="240" r="8" fill="#204E8E"/><circle cx="313" cy="244" r="6" fill="#204E8E"/><circle cx="300" cy="245" r="5" fill="#204E8E"/>
  </g>

  <!-- score badge: rays + faint track + thick gold progress arc (~72%) -->
  <g stroke="#E6A93C" stroke-width="4" stroke-linecap="round">
    <line x1="160" y1="40" x2="160" y2="54"/><line x1="132" y1="46" x2="138" y2="58"/><line x1="188" y1="46" x2="182" y2="58"/>
    <line x1="110" y1="66" x2="120" y2="74"/><line x1="210" y1="66" x2="200" y2="74"/>
  </g>
  <circle cx="160" cy="140" r="54" fill="#FFFFFF"/>
  <circle cx="160" cy="140" r="54" fill="none" stroke="#ECE0C6" stroke-width="7"/>
  <path d="M160 86 A54 54 0 1 1 108 154" stroke="#E6A93C" stroke-width="7" fill="none" stroke-linecap="round"/>
  <text x="160" y="118" font-family="Inter,system-ui,sans-serif" font-size="9.5" font-weight="800" fill="#204E8E" text-anchor="middle" letter-spacing=".5">AI VISIBILITY</text>
  <text x="160" y="130" font-family="Inter,system-ui,sans-serif" font-size="9.5" font-weight="800" fill="#204E8E" text-anchor="middle" letter-spacing=".5">SCORE</text>
  <text x="160" y="163" font-family="Inter,system-ui,sans-serif" font-size="30" font-weight="800" fill="#204E8E" text-anchor="middle">72%</text>
  <line x1="138" y1="170" x2="182" y2="170" stroke="#E6CFA0" stroke-width="1"/>
  <text x="160" y="182" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="8" fill="#9aa6b8" text-anchor="middle">AIでの可視性スコア</text>

  <!-- Shirube pointing, far left -->
  <g transform="translate(-24,20) scale(0.9)">
    <path d="M44 152 q-11 6 -13 15" stroke="#204E8E" stroke-width="8" fill="none" stroke-linecap="round"/>
    <rect x="28" y="156" width="4.5" height="12" rx="2.2" fill="#204E8E"/>
    <rect x="23" y="168" width="14" height="7" rx="2" fill="#C5432F"/>
    <circle cx="31" cy="166" r="5" fill="#204E8E"/>
    <path d="M90 150 q10 0 16 -6" stroke="#204E8E" stroke-width="8.5" fill="none" stroke-linecap="round"/>
    <circle cx="108" cy="143" r="5.4" fill="#204E8E"/>
    <path d="M110 139.5 L116 136.5" stroke="#204E8E" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <rect x="42" y="90" width="50" height="120" rx="14" fill="#204E8E"/>
    <rect x="54" y="208" width="11" height="9" rx="3.5" fill="#204E8E"/>
    <rect x="69" y="208" width="11" height="9" rx="3.5" fill="#204E8E"/>
    <circle cx="58" cy="114" r="4" fill="#fff"/><circle cx="76" cy="114" r="4" fill="#fff"/>
    <path d="M54 125 Q67 136 79 126.5 Q67 128 54 125 Z" fill="#FFC94F"/>
    <path d="M80 124 L85.5 126.6 L81.5 130 Z" fill="#FFC94F"/>
    <text x="67" y="161" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="10" font-weight="700" fill="#F9ECD9" text-anchor="middle" writing-mode="tb" letter-spacing="2">シルベ</text>
  </g>
</svg>
